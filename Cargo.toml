[package]
name = "SCKRNL"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[features]
fault-tests = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
aarch64-cpu = "12.0.0"
fdt = "0.1.5"
spinning_top = "0.3.0"
talc = { version = "5.1.1", features = ["counters"] }
